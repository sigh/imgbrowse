[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imgbrowse"
version = "0.1.0"
description = "A local image and video browser for folder trees and ZIP/CBZ archives"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
test = ["build", "setuptools>=61", "wheel"]

[project.scripts]
imgbrowse = "image_browser.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["image_browser", "image_browser.*"]
namespaces = false
