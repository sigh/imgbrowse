<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Browser</title>
    <link rel="stylesheet" href="/gallery.css">
    <script type="module" src="/gallery.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="choice-group mode-switch" role="group" aria-label="Mode">
            <button aria-pressed="true" disabled>Browse</button>
            <button id="read-folder" aria-pressed="false">View</button>
        </div>
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="Folder path"></nav>
        <div class="browse-controls">
            <div class="choice-group" role="group" aria-label="Folder layout">
                <button id="layout-previews" data-layout="previews" aria-pressed="true">Previews</button>
                <button id="layout-list" data-layout="list" aria-pressed="false">List</button>
            </div>
        </div>
    </header>
    <div class="toolbar">
        <input id="filter" type="search" placeholder="Filter this folder by name" aria-label="Filter this folder by name">
    </div>
    <main id="grid-viewport" tabindex="0" aria-label="Folder contents">
        <div id="grid"></div>
        <p id="grid-status" role="status"></p>
        <button id="load-more" hidden>Retry</button>
    </main>
    <footer id="summary" aria-live="polite"></footer>

    <section id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
        <header class="viewer-header">
            <div class="choice-group mode-switch" role="group" aria-label="Mode">
                <button id="viewer-close" aria-pressed="false" title="Browse (Escape)">Browse</button>
                <button aria-pressed="true" disabled>View</button>
            </div>
            <div class="viewer-location"><nav id="viewer-path" class="breadcrumbs" aria-label="Image folder path"></nav><div id="viewer-name"></div></div>
            <div class="viewer-tools" aria-label="Reading controls">
                <div class="size-control">
                    <button id="viewer-zoom" aria-expanded="false" aria-controls="size-menu">Fit ▾</button>
                    <div id="size-menu" role="group" aria-label="Image size" hidden>
                        <button data-size="page">Fit page</button>
                        <button data-size="width">Fit width</button>
                        <button data-size="1">Actual size</button>
                        <div class="zoom-controls">
                            <button id="viewer-zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
                            <span id="zoom-value"></span>
                            <button id="viewer-zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
                        </div>
                    </div>
                </div>
                <div class="choice-group viewer-layouts" role="group" aria-label="Viewing layout">
                    <button id="view-grid" title="Grid" aria-label="Grid" aria-pressed="false"></button>
                    <button id="view-strip" title="Image with thumbnails (T)" aria-label="Image with thumbnails" aria-pressed="true"></button>
                    <button id="view-single" title="Image only (T)" aria-label="Image only" aria-pressed="false"></button>
                </div>
            </div>
        </header>
        <div id="overview" hidden></div>
        <div id="viewer-stage" class="viewer-stage">
            <button id="viewer-prev" class="viewer-nav" aria-label="Previous image" title="Previous image (←)"><span aria-hidden="true">❮</span><span class="nav-label">Previous</span></button>
            <div id="viewer-canvas" tabindex="-1" aria-label="Image; scroll when enlarged"><div class="image-surface"><img id="viewer-image" alt="" hidden></div></div>
            <button id="viewer-next" class="viewer-nav" aria-label="Next image" title="Next image (→)"><span aria-hidden="true">❯</span><span class="nav-label">Next</span></button>
        </div>
        <div class="viewer-footer">
            <span id="viewer-status" role="status"></span>
            <button id="viewer-retry" hidden>Retry</button>
        </div>
        <div id="viewer-strip" class="viewer-strip" aria-label="Collection thumbnails" tabindex="0" hidden></div>
    </section>
</body>
</html>
