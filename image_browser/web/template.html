<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Browser</title>
    <link rel="stylesheet" href="/gallery.css">
    <script type="module" src="/gallery.js"></script>
</head>
<body>
    <header class="app-header">
        <button id="read-folder" data-icon="play" class="mode-action" aria-label="View folder images" title="View folder images"></button>
        <div id="browse-location" class="item-location">
            <div class="path-copy"></div>
            <nav id="breadcrumbs" class="breadcrumbs" aria-label="Folder path"></nav>
            <span class="item-name" hidden></span>
        </div>
        <div id="browse-actions" class="item-actions"></div>
    </header>
    <div class="toolbar">
        <div class="browse-controls choice-group" role="group" aria-label="Folder layout">
            <button id="layout-previews" data-layout="previews" data-icon="previews" aria-pressed="true" aria-label="Previews" title="Previews"></button>
            <button id="layout-list" data-layout="list" data-icon="list" aria-pressed="false" aria-label="List" title="List"></button>
        </div>
        <input id="filter" type="search" placeholder="Filter" aria-label="Filter this folder by name">
    </div>
    <main id="grid-viewport" tabindex="0" aria-label="Folder contents">
        <div id="grid"></div>
        <p id="grid-status" role="status"></p>
        <button id="load-more" hidden>Retry</button>
    </main>
    <footer id="summary" aria-live="polite"></footer>

    <section id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
        <header class="viewer-header">
            <button id="viewer-close" data-icon="back" class="mode-action" aria-label="Return to folder" title="Return to folder (Escape)"></button>
            <div id="viewer-location" class="item-location">
                <div class="path-copy"></div>
                <nav id="viewer-path" class="breadcrumbs" aria-label="Image path"></nav>
                <span id="viewer-name" class="item-name" hidden></span>
            </div>
            <div class="viewer-tools" aria-label="Reading controls">
                <div class="size-control">
                    <button id="viewer-zoom" aria-expanded="false" aria-controls="size-menu">Fit ▾</button>
                    <div id="size-menu" role="group" aria-label="Image size" hidden>
                        <button data-size="page">Fit page</button>
                        <button data-size="width">Fit width</button>
                        <button data-size="1">Actual size</button>
                        <div class="zoom-controls">
                            <button id="viewer-zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
                            <span id="zoom-value"></span>
                            <button id="viewer-zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
                        </div>
                    </div>
                </div>
                <div class="choice-group viewer-layouts" role="group" aria-label="Viewing layout">
                    <button id="view-grid" data-view-layout="grid" data-icon="grid" title="Collection overview" aria-label="Collection overview" aria-pressed="false"></button>
                    <button id="view-strip" data-view-layout="strip" data-icon="thumbnails" title="Image with thumbnails (T)" aria-label="Image with thumbnails" aria-pressed="true"></button>
                    <button id="view-single" data-view-layout="single" data-icon="image" title="Image only (T)" aria-label="Image only" aria-pressed="false"></button>
                </div>
            </div>
            <div id="viewer-actions" class="item-actions"></div>
        </header>
        <div id="overview" hidden></div>
        <div id="viewer-stage" class="viewer-stage">
            <button id="viewer-prev" class="viewer-nav" aria-label="Previous image" title="Previous image (←)"></button>
            <div id="viewer-canvas" tabindex="-1" aria-label="Image; scroll when enlarged">
                <div class="image-surface"><img id="viewer-image" alt="" hidden></div>
            </div>
            <button id="viewer-next" class="viewer-nav" aria-label="Next image" title="Next image (→)"></button>
            <div class="viewer-feedback">
                <span id="viewer-status" role="status"></span>
                <button id="viewer-retry" hidden>Retry</button>
            </div>
        </div>
        <div id="viewer-strip" class="viewer-strip" aria-label="Collection thumbnails" tabindex="0" hidden></div>
    </section>
    <section id="metadata-popover" popover="manual" role="region" aria-labelledby="metadata-title">
        <header class="metadata-header">
            <h2 id="metadata-title">Info</h2>
        </header>
        <p id="metadata-status" role="status"></p>
        <dl id="metadata-details"></dl>
    </section>
</body>
</html>
