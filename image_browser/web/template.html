<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Browser</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/gallery.css">
    <script type="module" src="/gallery.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="header-start">
            <button id="folders-toggle" data-icon="sidebar" aria-label="Folders" title="Folders" aria-controls="folder-tree" aria-expanded="false"></button>
            <nav class="mode-navigation choice-group" aria-label="Screens">
                <a id="browse-folder" class="control-link" data-mode="browse" data-icon="folder" aria-label="Browse" title="Browse (Escape)"></a>
                <a id="overview-folder" class="control-link" data-mode="overview" data-icon="grid" aria-label="Collection overview" title="Collection overview"></a>
            </nav>
        </div>
        <nav class="reading-navigation choice-group" aria-label="View presentation">
            <a id="read-strip" class="control-link" data-reading-layout="strip" data-icon="readerStrip" aria-label="Thumbnails and single image" title="Thumbnails and single image"></a>
            <a id="read-single" class="control-link" data-reading-layout="single" data-icon="readerSingle" aria-label="Single image" title="Single image"></a>
            <a id="read-scroll" class="control-link" data-reading-layout="scroll" data-icon="readerScroll" aria-label="Continuous scroll" title="Continuous scroll"></a>
        </nav>
        <div id="item-location" class="item-location">
            <nav id="item-path" class="breadcrumbs" aria-label="Path">
                <span id="item-name" class="item-name" hidden></span>
            </nav>
        </div>
        <div class="viewer-tools choice-group" role="group" aria-label="Zoom">
            <button id="viewer-zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
            <button id="viewer-zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
        </div>
        <div id="item-actions" class="item-actions"></div>
    </header>
    <div class="workspace">
        <nav id="folder-tree" class="folder-tree" aria-label="Folders" hidden>
            <ul role="tree" aria-label="Folder navigation"></ul>
        </nav>
        <div id="workspace-content">
            <div class="toolbar">
                <div class="browse-controls choice-group" role="group" aria-label="Folder layout">
                    <button id="layout-previews" data-layout="previews" data-icon="previews" aria-pressed="true" aria-label="Previews" title="Previews"></button>
                    <button id="layout-list" data-layout="list" data-icon="list" aria-pressed="false" aria-label="List" title="List"></button>
                </div>
                <input id="filter" type="search" placeholder="Filter" aria-label="Filter this folder by name">
            </div>
            <main id="grid-viewport" tabindex="0" aria-label="Folder contents">
                <div id="grid"></div>
                <p id="grid-status" role="status"></p>
                <button id="load-more" hidden>Retry</button>
            </main>
            <footer id="summary" aria-live="polite"></footer>
            <section id="viewer" class="viewer" role="region" aria-label="Media viewer" hidden>
                <div id="overview" hidden></div>
                <div id="viewer-stage" class="viewer-stage">
                    <button id="viewer-prev" class="viewer-nav" aria-label="Previous image" title="Previous image (←)"></button>
                    <div id="viewer-canvas" tabindex="0" aria-label="Media; scroll to read">
                        <div class="image-surface"><img id="viewer-image" alt="" hidden></div>
                    </div>
                    <button id="viewer-next" class="viewer-nav" aria-label="Next image" title="Next image (→)"></button>
                    <div class="viewer-feedback">
                        <span id="viewer-status" role="status"></span>
                        <button id="viewer-retry" hidden>Retry</button>
                    </div>
                </div>
                <div id="viewer-strip" class="viewer-strip" role="group" aria-label="Collection thumbnails" hidden></div>
            </section>
        </div>
    </div>
    <section id="metadata-popover" popover="manual" tabindex="0" role="region" aria-labelledby="metadata-title">
        <header class="metadata-header">
            <h2 id="metadata-title">Info</h2>
            <button id="metadata-close" class="metadata-close" data-icon="close" aria-label="Close Info" title="Close Info"></button>
        </header>
        <p id="metadata-status" role="status"></p>
        <div id="metadata-details"></div>
    </section>
</body>
</html>
